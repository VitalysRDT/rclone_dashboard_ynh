#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;

# Static assets — public (no SSO), cached, served by Flask static handler.
# access_by_lua_block { } neutralizes the server-level SSOwat access check.
location __PATH__/static/ {
  access_by_lua_block { }
  proxy_pass http://127.0.0.1:__PORT__/static/;
  proxy_redirect off;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  expires 7d;
  add_header Cache-Control "public, immutable";
}

# Main app — SSO-protected.
location __PATH__/ {

  # Strip Remote-User header from inbound requests BEFORE SSOwat injects it.
  # Defense against header spoofing if backend is ever exposed.
  proxy_set_header Remote-User "";
  proxy_set_header Ynh-User "";
  proxy_set_header Ynh-User-Email "";

  # Proxy to the local Flask gunicorn. Trailing slash on proxy_pass strips __PATH__/ from URI.
  proxy_pass http://127.0.0.1:__PORT__/;
  proxy_redirect off;
  proxy_buffering off;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # 'unsafe-eval' is required by Alpine.js (uses new Function() to evaluate x-* expressions).
  # 'unsafe-inline' is required by Tailwind runtime (cdn.tailwindcss.com injects style tags).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.tailwindcss.com; style-src-elem 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.tailwindcss.com; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self';" always;

  # Include SSOwat config — this is what enforces auth_header=true from manifest.
  include conf.d/yunohost_panel.conf.inc;
  more_clear_input_headers 'Accept-Encoding';
}
