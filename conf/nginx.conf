#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  # Strip Remote-User header from inbound requests BEFORE SSOwat injects it.
  # Defense against header spoofing if backend is ever exposed.
  proxy_set_header Remote-User "";
  proxy_set_header Ynh-User "";
  proxy_set_header Ynh-User-Email "";

  # Then proxy to the local Flask gunicorn.
  proxy_pass http://127.0.0.1:__PORT__/;
  proxy_redirect off;
  proxy_buffering off;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self';" always;

  # Static asset caching
  location ~* __PATH__/static/.*\.(js|css|png|jpg|svg)$ {
    proxy_pass http://127.0.0.1:__PORT__$request_uri;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  # Include SSOwat config — this is what enforces auth_header=true from manifest.
  include conf.d/yunohost_panel.conf.inc;
  more_clear_input_headers 'Accept-Encoding';
}
