packaging_format = 2

id = "rclone_dashboard"
name = "rclone Dashboard"
description.en = "Real-time dashboard for monitoring rclone mounts, VFS cache, transfers, and operational health."
description.fr = "Tableau de bord temps-réel pour surveiller les mounts rclone, le cache VFS, les transferts et la santé opérationnelle."

version = "0.1.4~ynh1"

maintainers = ["vitalys"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://github.com/VitalysRDT/rclone-dashboard"
admindoc = "https://github.com/VitalysRDT/rclone-dashboard/blob/main/doc/ADMIN.md"
code = "https://github.com/VitalysRDT/rclone-dashboard"

[integration]
yunohost = ">= 12.0"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = false
sso = true
disk = "100M"
ram.build = "200M"
ram.runtime = "256M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/rclone"

    [install.init_main_permission]
    help.en = "Restrict access to YunoHost users. Public access would expose rclone state."
    help.fr = "Accès restreint aux utilisateurs YunoHost. L'accès public exposerait l'état rclone."
    type = "group"
    default = "admins"

    [install.rclone_rc_url]
    ask.en = "rclone Remote Control API URL"
    ask.fr = "URL de l'API rclone Remote Control"
    help.en = "Where the rclone daemon's RC API listens. Default works for local rclone with --rc --rc-addr 127.0.0.1:5572."
    type = "url"
    default = "http://127.0.0.1:5572"

    [install.poll_interval_ms]
    ask.en = "Polling interval in milliseconds"
    help.en = "How often the dashboard queries the rclone RC API. 2000ms = 2 seconds (recommended)."
    type = "number"
    min = 500
    max = 30000
    default = 2000

[resources]
    [resources.sources.main]
    url = "https://github.com/VitalysRDT/rclone_dashboard_ynh/archive/v0.1.3-pre.tar.gz"
    sha256 = "00e680374ca6cf607c432cd93e549cc3b8b48749778442e2bc39dc008942b585"
    autoupdate.strategy = "latest_github_release"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
        [resources.permissions.main]
        url = "/"
        auth_header = true
        show_tile = true

    [resources.ports]
        [resources.ports.main]
        default = 18572

    [resources.apt]
    packages = "python3, python3-pip, python3-venv"
